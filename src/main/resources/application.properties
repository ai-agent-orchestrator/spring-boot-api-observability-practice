
spring.threads.virtual.enabled=true

logging.level.com.ohgiraffers.handlermethod=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-none}]

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=spring-boot-api-observability-practice
management.info.env.enabled=true

info.app.name=spring-boot-api-observability-practice
info.app.description=Metrics, logs, and traceId practice for API observability
